name: issue-to-pr

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create_friend_pr:
    if: ${{ startsWith(github.event.issue.title, '[友链申请]') && (github.event_name == 'issues' || (github.event_name == 'issue_comment' && !github.event.issue.pull_request && github.event.comment.body == '重新检查')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Create friend data PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PAT || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const body = issue.body || '';

            if (context.eventName === 'issue_comment') {
              const branch = `friend-issue-${issueNumber}`;
              const openPulls = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${branch}`,
              });
              const pull = openPulls.data[0];
              if (!pull) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: '当前没有可重新检查的友链 PR。请先确认该申请仍在处理中。',
                });
                return;
              }

              await github.rest.pulls.update({ owner, repo, pull_number: pull.number, state: 'closed' });
              await github.rest.pulls.update({ owner, repo, pull_number: pull.number, state: 'open' });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `已请求重新检查。底层 PR #${pull.number} 已重新触发自动校验，请稍候查看本 Issue 的申请状态。`,
              });
              return;
            }

            function section(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = body.match(new RegExp(`### ${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`));
              if (!match) return '';
              const value = match[1].trim();
              return value === '_No response_' ? '' : value;
            }

            const name = section('站点名称');
            const url = section('网站 URL');
            const avatar = section('头像 URL');
            const description = section('站点简介');
            const backlink = section('友链页面 URL');

            const missing = [];
            if (!name) missing.push('站点名称');
            if (!url) missing.push('网站 URL');
            if (!avatar) missing.push('头像 URL');
            if (!backlink) missing.push('友链页面 URL');

            function isHttpUrl(value) {
              try {
                const parsed = new URL(value);
                return parsed.protocol === 'http:' || parsed.protocol === 'https:';
              } catch {
                return false;
              }
            }

            if (missing.length || !isHttpUrl(url) || !isHttpUrl(avatar) || !isHttpUrl(backlink)) {
              const problems = [];
              if (missing.length) problems.push(`缺少字段：${missing.join('、')}`);
              if (url && !isHttpUrl(url)) problems.push('网站 URL 不是有效的 http/https 地址');
              if (avatar && !isHttpUrl(avatar)) problems.push('头像 URL 不是有效的 http/https 地址');
              if (backlink && !isHttpUrl(backlink)) problems.push('友链页面 URL 不是有效的 http/https 地址');
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `无法创建友链数据 PR：\n\n- ${problems.join('\n- ')}\n\n请直接编辑此 Issue 修正内容，保存后会自动重新处理。`,
              });
              return;
            }

            const entry = { name, avatar };
            if (description) entry.description = description;
            entry.url = url;
            entry.backlink = backlink;

            const path = `data/friends/issue-${issueNumber}.json`;
            const branch = `friend-issue-${issueNumber}`;
            const defaultBranch = context.payload.repository.default_branch;

            // If this Issue has already been merged once, do not create a duplicate PR.
            try {
              await github.rest.repos.getContent({ owner, repo, path, ref: defaultBranch });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `该申请已经存在于 \`${path}\`，不再重复创建 PR。`,
              });
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const openPulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
            });
            const existingPull = openPulls.data[0] || null;

            if (!existingPull) {
              const baseRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${defaultBranch}` });
              try {
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/heads/${branch}`,
                  sha: baseRef.data.object.sha,
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(existing.data)) existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: existingPull
                ? `friend: update ${name} from issue #${issueNumber}`
                : `friend: add ${name} from issue #${issueNumber}`,
              content: Buffer.from(`${JSON.stringify(entry, null, 2)}\n`).toString('base64'),
              ...(existingSha ? { sha: existingSha } : {}),
            });

            if (existingPull) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existingPull.number,
                title: `友链：${name}`,
              });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `已根据 Issue 的最新内容更新数据 PR：${existingPull.html_url}\n\n自动校验会重新运行，无需修改 PR。`,
              });
              return;
            }

            const pull = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: defaultBranch,
              title: `友链：${name}`,
              body: `由友链申请 Issue #${issueNumber} 自动生成。\n\nCloses #${issueNumber}`,
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `已创建数据 PR：${pull.data.html_url}\n\n后续继续使用现有自动校验流程；通过并合并后，本 Issue 会自动关闭。`,
            });
