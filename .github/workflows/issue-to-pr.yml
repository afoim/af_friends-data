name: friend-application

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: friend-application-${{ github.event.issue.number }}-${{ github.event_name == 'issues' || github.event.comment.body == '重新检查' }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.issue.state == 'open' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[友链申请]') &&
      ((github.event_name == 'issues' && (github.event.action != 'edited' || github.event.changes.body)) ||
      (github.event_name == 'issue_comment' && github.event.comment.body == '重新检查' &&
      (github.event.comment.user.id == github.event.issue.user.id ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    outputs:
      approved: ${{ steps.review.outputs.approved }}
      approval: ${{ steps.review.outputs.approval }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Review the Issue (no repository write token)
        id: review
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            await require('./.github/scripts/friend-application.js').review({ github, context, core });

  execute:
    needs: review
    if: needs.review.outputs.approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Serialize writes. If main changed since review, fail closed and ask to retry.
    concurrency:
      group: friend-application-executor
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute the approved snapshot only
        uses: actions/github-script@v9
        env:
          APPROVAL: ${{ needs.review.outputs.approval }}
        with:
          # PAT is isolated to this step, to retain the existing external deploy integration.
          github-token: ${{ secrets.PAT || github.token }}
          script: |
            await require('./.github/scripts/friend-application.js').execute({ github, context, core });
