name: auto-pr
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (empty checks pending requests)
        required: false
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: auto-pr-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || 'pending' }}
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.body == '准备完毕')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      results: ${{ steps.check.outputs.results }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - id: check
        uses: actions/github-script@v9
        with:
          script: |
            const { checkRequests } = require('./.github/scripts/auto-pr.js');
            core.setOutput('results', JSON.stringify(await checkRequests({github, context})));
  apply:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        env:
          CHECK_RESULTS: ${{ needs.check.outputs.results }}
        with:
          script: |
            const { applyResults } = require('./.github/scripts/auto-pr.js');
            await applyResults({github, context}, JSON.parse(process.env.CHECK_RESULTS));
